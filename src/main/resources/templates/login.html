<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
</head>
<body>

<h2>Login</h2>

<form th:action="@{/login}" method="post">

    <div>
        <label>Email:</label>
        <input type="text" name="username" required />
    </div>

    <div>
        <label>Senha:</label>
        <input type="password" name="password" required />
    </div>

    <div>
        <button type="submit">Entrar</button>
    </div>

</form>

<p>
    Não tem conta?
    <a th:href="@{/register}">Cadastre-se</a>
</p>

</body>
</html>
